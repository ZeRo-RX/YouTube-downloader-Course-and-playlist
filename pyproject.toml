[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-downloader-course-and-playlist"
version = "1.1.0"
description = "Professional-grade YouTube course downloader with auto-scheduling, quality control and persistent state."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [
    { name = "ZeRo" },
]
keywords = ["youtube", "downloader", "playlist", "course", "yt-dlp", "scheduler"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "yt-dlp>=2024.1.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
]

[project.scripts]
youtube-downloader = "youtube_downloader.downloader:main"
youtube-auto-downloader = "youtube_downloader.auto_downloader:main"

[project.urls]
Homepage = "https://github.com/ZeRo-RX/YouTube-downloader-Course-and-playlist"
Issues = "https://github.com/ZeRo-RX/YouTube-downloader-Course-and-playlist/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["youtube_downloader*"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/youtube_downloader"]

[tool.coverage.report]
show_missing = true